# Run-to-completion orchestrator. Usable standalone or `include`d by a parent
# project's compose file (paths are relative to this file).
#
#   cp .env.example .env
#   docker compose --profile orchestrator build
#   docker compose run --rm -T orchestrator run /examples/hello.json > report.json
#
# It drives the host Docker daemon through the mounted socket: task
# containers are *siblings* on the host, not nested inside this container.
# Each one gets its own network; `sandbox-guard` firewalls those networks off
# from the host, the LAN and each other before the orchestrator starts.
#
# Naming (images, network, labels, bridge prefix) is parameterised so an
# embedding project can keep its own conventions; see README, "Embedding".

services:
  orchestrator:
    build: .
    image: ${IMAGE_NAMESPACE:-swarm}/orchestrator:latest
    profiles: ["orchestrator"]
    init: true
    user: "65532:65532"
    # Socket access without root: join the host's docker group.
    group_add: ["${DOCKER_GID:?set DOCKER_GID in .env (stat -c %g /var/run/docker.sock)}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    # Shared with event bus / database services. Task containers can never
    # reach it: they live on their own bridges (`${BRIDGE_PREFIX}*`), which
    # sandbox-guard firewalls off from all private ranges (and Docker
    # isolates bridges).
    networks: [backend]
    depends_on:
      sandbox-guard:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jobs:/jobs:ro
    environment:
      # Secrets for tasks: an embedding project adds variable NAMES here (via
      # an extra compose file); values come from the shell or .env and are
      # forwarded to task containers via `env_passthrough` in the job file.
      # Task containers alive at once (host capacity, not a job setting).
      - ORCHESTRATOR_MAX_PARALLEL=${MAX_PARALLEL:-2}
      - ORCHESTRATOR_TASK_RUNTIME=${TASK_RUNTIME:-}
      - ORCHESTRATOR_TASK_DNS=${TASK_DNS:-1.1.1.1,8.8.8.8}
      - ORCHESTRATOR_LABEL_PREFIX=${LABEL_PREFIX:-swarm}
      - ORCHESTRATOR_BRIDGE_PREFIX=${BRIDGE_PREFIX:-sw}

  # One-shot: installs the host firewall rules isolating task containers
  # (sandbox-guard/guard.sh). Idempotent; runs before every orchestrator run.
  sandbox-guard:
    build: ./sandbox-guard
    image: ${IMAGE_NAMESPACE:-swarm}/sandbox-guard:latest
    profiles: ["orchestrator"]
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    read_only: true
    mem_limit: 32m
    restart: "no"
    environment:
      - BRIDGE_PREFIX=${BRIDGE_PREFIX:-sw}

networks:
  # Service network. A parent project that wants to share it declares it with
  # the same name; Compose merges identical declarations across includes.
  backend:
    name: ${BACKEND_NETWORK:-swarm-backend}
