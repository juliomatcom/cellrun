[package]
name = "cellrun"
description = "Small dispatcher for ephemeral, isolated Docker containers that run shell steps."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
default-run = "dispatcher"

[lib]
name = "cellrun"
path = "src/lib.rs"

[[bin]]
name = "dispatcher"
path = "src/main.rs"

# Layers live in src/{domain,application,infrastructure}; main.rs is the
# composition root. tests/architecture.rs enforces the dependency rule.
[dependencies]
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "signal", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
